              - generic [ref=f1e1063]: How a berm is measured. The shelf widens the section, so its earth is already inside the formation (and rolling) quantity, and the wider seating is stripped with it — nothing here double-counts that. Pitching and turfing are slope work, so the horizontal shelf is deducted from the face lengths and paid through its own surfacing item instead. A berm exists only where the face still falls below its RL, so it tapers out on its own where the bund becomes shallow.
