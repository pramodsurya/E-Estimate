            - generic [ref=f1e914]: The toe ground RLs and global design dimensions generate the bund points. The U/S toe-wall and D/S toe-drain limits are then added automatically from their top widths. Enter every existing ground RL surveyed outside the toes; when an outside RL is blank, the nearest entered ground RL is carried level to that limit. Intermediate blanks follow the straight line through the entered RLs. The chart and quantities use that same line. The proposed line stays at the fixed design RL, with level platforms outside the two bund toes. The automatic stripped / cut level uses the normal strip depth where the bund is above ground. Where existing ground is higher than design, it stops at the design RL, so only the excess is removed and the bund is never raised or reshaped.
