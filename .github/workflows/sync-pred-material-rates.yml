name: Sync PRED material rates

on:
  schedule:
    # Every Monday at 02:10 Asia/Kolkata (20:40 UTC on the preceding day).
    # The script enforces the exact 14-day interval, including across months.
    - cron: '40 20 * * 0'
  workflow_dispatch:
    inputs:
      list_models:
        description: Only report which models this API key can reach
        required: false
        type: boolean
        default: false
      dry_run:
        description: Read the circulars and print the rates; write nothing
        required: false
        type: boolean
        default: false
      model:
        description: Model id to read with (blank uses the pinned default)
        required: false
        type: string
        default: ''
      limit:
        description: Maximum circulars to process
        required: false
        type: string
        default: '3'

# Do not add pull_request or pull_request_target here. This workflow holds a
# privileged database secret and must only run trusted repository code.
permissions:
  contents: read

concurrency:
  group: pred-material-rate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.model }}
      INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      INPUT_LIMIT: ${{ inputs.limit || '3' }}
      IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4

      - name: Install the PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Verify parser behaviour
        run: python3 -m unittest scripts/rate-sync/test_pred_material_rate_sync.py

      - name: Report reachable models
        if: ${{ inputs.list_models }}
        run: python3 scripts/rate-sync/vision_reader.py --list-models

      - name: Discover, extract and upload rates
        if: ${{ !inputs.list_models }}
        run: |
          args=(--limit "$INPUT_LIMIT")
          if [[ "$IS_SCHEDULED" == "true" ]]; then
            args+=(--scheduled)
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/rate-sync/pred_material_rate_sync.py "${args[@]}"
