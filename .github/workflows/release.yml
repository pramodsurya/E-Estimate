# Build the Windows installer and publish it as a GitHub Release.
#
# Tauri NSIS builds must run on Windows. Auto-update via tauri-plugin-updater
# is not wired yet — this workflow ships the installer only.
#
# To ship:  git tag v0.1.9 && git push origin v0.1.9
# Or run this workflow with a bump of patch/minor/major and it will tag for you.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump when releasing from master'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Bump version and tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          npm version ${{ github.event.inputs.bump }} -m 'chore: release v%s'
          new="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json"));
            conf.version = v;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8")
              .replace(/^version = ".*"$/m, `version = "${v}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          ' "$new"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit --amend --no-edit
          # The updater compares against the version baked into the binary
          # (tauri.conf.json), so the tag must point at the commit carrying it.
          git tag -f "v$new"
          git push origin HEAD:master
          git push --force origin "v$new"

      - name: Create the release before publishing into it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already exists, publishing into it"
          else
            gh release create "$version" --title "${version#v}" --generate-notes
          fi

      - name: Install analysis-engine Python deps
        shell: bash
        run: pip install -r analysis/requirements-packaging.txt

      - name: Build analysis engine and Tauri bundle
        run: npm run publish:win
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload NSIS installer, signature and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          installer=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' -type f | head -n 1)
          if [ -z "$installer" ]; then
            echo 'NSIS installer was not produced'
            exit 1
          fi
          sig="${installer}.sig"
          if [ ! -f "$sig" ]; then
            echo 'Update signature was not produced (set createUpdaterArtifacts and TAURI_SIGNING_PRIVATE_KEY)'
            exit 1
          fi
          installer_name="$(basename "$installer")"
          sig_content="$(cat "$sig")"
          asset_url="https://github.com/pramodsurya/E-Estimate/releases/download/${tag}/${installer_name}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node -e '
            const fs = require("fs");
            const [v, pub, sig, url] = process.argv.slice(1);
            const payload = {
              version: v,
              notes: "",
              pub_date: pub,
              platforms: { "windows-x86_64": { signature: sig, url } }
            };
            fs.writeFileSync("latest.json", JSON.stringify(payload, null, 2));
          ' "$version" "$pub_date" "$sig_content" "$asset_url"
          echo "Uploading $installer_name, its signature and latest.json"
          gh release upload "$tag" "$installer" "$sig" latest.json --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '\.exe$'
